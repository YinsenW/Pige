name: Security contact request
description: Request a private channel if GitHub private vulnerability reporting is temporarily unavailable.
title: "[Security contact request]"
labels:
  - security
body:
  - type: markdown
    attributes:
      value: |
        Do not include vulnerability details, exploit steps, secrets, screenshots, logs, private files, or payloads in this public issue.

        Use this fallback only if GitHub private vulnerability reporting is temporarily unavailable.
  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I have not included vulnerability details or private data in this public issue.
          required: true
        - label: I need a private channel to share security details.
          required: true
