name: Ad-hoc macOS prerelease publication

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ad-hoc-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate exact protected release tag
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Validate release identity
        id: release
        env:
          PIGE_RELEASE_TAG: ${{ github.ref_name }}
          PIGE_RELEASE_EVENT: ${{ github.event_name }}
          PIGE_RELEASE_REPOSITORY: ${{ github.repository }}
          PIGE_RELEASE_REF_PROTECTED: ${{ github.ref_protected }}
        run: >-
          node scripts/release/release-tag.mjs
          --tag="$PIGE_RELEASE_TAG"
          --event="$PIGE_RELEASE_EVENT"
          --repository="$PIGE_RELEASE_REPOSITORY"
          --protected-ref="$PIGE_RELEASE_REF_PROTECTED"
          --github-output="$GITHUB_OUTPUT"

  quality:
    name: Release quality and security gates
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout validated release commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ needs.validate.outputs.commit }}

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.14.0"
          cache: npm

      - name: Install pinned dependencies
        run: npm ci

      - name: Audit packaged runtime dependencies
        run: npm audit --omit=dev

      - name: Verify governed repository contracts
        run: npm run verify

      - name: Run test suite
        run: npm test -- --maxWorkers=1

  build-macos-arm64:
    name: Build ad-hoc sealed macOS arm64 ZIP
    needs: [validate, quality]
    runs-on: macos-26
    timeout-minutes: 60
    env:
      PIGE_RELEASE_TAG: ${{ needs.validate.outputs.tag }}
      PIGE_RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      PIGE_RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
      PIGE_EXPECTED_APP_VERSION: ${{ needs.validate.outputs.version }}
      PIGE_REPORT_BUILD_ID: ${{ needs.validate.outputs.commit }}
      PIGE_REPORT_PLATFORM: macos-arm64
      PIGE_SCALE_BUILD_ID: ${{ needs.validate.outputs.commit }}
      PIGE_SCALE_SKIP_BUILD: "1"
    steps:
      - name: Checkout validated release commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ needs.validate.outputs.commit }}

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.14.0"
          cache: npm

      - name: Install pinned dependencies
        run: npm ci

      - name: Audit packaged runtime dependencies
        run: npm audit --omit=dev

      - name: Build versioned ad-hoc ZIP
        run: npm run release:package:mac:arm64

      - name: Verify built application and distribution
        run: npm run smoke:packaged:mac:arm64

      - name: Create immutable ZIP manifest
        run: >-
          npm run release:artifacts --
          --action=create
          --directory=artifacts/release-packageability/macos-arm64
          --platform=macos-arm64
          --tag="$PIGE_RELEASE_TAG"
          --commit="$PIGE_RELEASE_COMMIT"

      - name: Generate and bind Public Alpha release acceptance evidence
        run: |
          npm run release:public-alpha-scenario
          npm run evidence:local-scale
          node scripts/release/release-evidence-bundle.mjs \
            --action=stage \
            --directory=artifacts/release-packageability/macos-arm64 \
            --tag="$PIGE_RELEASE_TAG" \
            --commit="$PIGE_RELEASE_COMMIT" \
            --build-id="$PIGE_RELEASE_COMMIT" \
            --public-alpha-report="artifacts/release-evidence/v0.1/public-alpha-usability/macos-arm64/$PIGE_RELEASE_COMMIT/scenario-report.json" \
            --local-scale-report="artifacts/test-reports/local-database-scale/macos-arm64/$PIGE_RELEASE_COMMIT/report.json"

      - name: Stage bounded build evidence
        run: |
          cp "artifacts/test-reports/packageability/macos-arm64/$PIGE_RELEASE_COMMIT/report.json" \
            artifacts/release-packageability/macos-arm64/packageability-report.json
          cp "artifacts/test-reports/packageability/macos-arm64/$PIGE_RELEASE_COMMIT/packaged-ui.png" \
            artifacts/release-packageability/macos-arm64/packaged-ui.png
          cp artifacts/release-packageability/package-resources/sbom/pige.cdx.json \
            artifacts/release-packageability/macos-arm64/pige.cdx.json
          cp artifacts/release-packageability/package-resources/legal/third-party-attribution.json \
            artifacts/release-packageability/macos-arm64/third-party-attribution.json
          cp NOTICE artifacts/release-packageability/macos-arm64/NOTICE
          cp LICENSE artifacts/release-packageability/macos-arm64/LICENSE

      - name: Upload untrusted but intact macOS candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pige-release-macos-arm64-${{ needs.validate.outputs.commit }}
          path: |
            artifacts/release-packageability/macos-arm64/Pige-${{ needs.validate.outputs.version }}-arm64.zip
            artifacts/release-packageability/macos-arm64/release-manifest-macos-arm64.json
            artifacts/release-packageability/macos-arm64/SHA256SUMS-macos-arm64.txt
            artifacts/release-packageability/macos-arm64/packageability-report.json
            artifacts/release-packageability/macos-arm64/packaged-ui.png
            artifacts/release-packageability/macos-arm64/public-alpha-scenario-report.json
            artifacts/release-packageability/macos-arm64/local-database-scale-report.json
            artifacts/release-packageability/macos-arm64/pige.cdx.json
            artifacts/release-packageability/macos-arm64/third-party-attribution.json
            artifacts/release-packageability/macos-arm64/NOTICE
            artifacts/release-packageability/macos-arm64/LICENSE
          if-no-files-found: error
          retention-days: 2

  verify-macos-arm64:
    name: Qualify freshly downloaded ad-hoc macOS arm64 ZIP
    needs: [validate, build-macos-arm64]
    runs-on: macos-26
    timeout-minutes: 20
    env:
      PIGE_RELEASE_TAG: ${{ needs.validate.outputs.tag }}
      PIGE_RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      PIGE_RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
    steps:
      - name: Checkout verifier at validated commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ needs.validate.outputs.commit }}

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.14.0"

      - name: Download macOS candidate
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: pige-release-macos-arm64-${{ needs.validate.outputs.commit }}
          path: artifacts/release-packageability/macos-arm64

      - name: Verify immutable downloaded ZIP manifest
        run: >-
          node scripts/release/release-artifacts.mjs
          --action=verify
          --directory=artifacts/release-packageability/macos-arm64
          --platform=macos-arm64
          --tag="$PIGE_RELEASE_TAG"
          --commit="$PIGE_RELEASE_COMMIT"

      - name: Verify downloaded release acceptance evidence
        run: >-
          node scripts/release/release-evidence-bundle.mjs
          --action=verify
          --directory=artifacts/release-packageability/macos-arm64
          --tag="$PIGE_RELEASE_TAG"
          --commit="$PIGE_RELEASE_COMMIT"
          --build-id="$PIGE_RELEASE_COMMIT"

      - name: Qualify downloaded app, Gatekeeper class, runtime, UI, and memory
        run: >-
          node scripts/release/macos-downloaded-qualification.mjs
          --directory=artifacts/release-packageability/macos-arm64
          --tag="$PIGE_RELEASE_TAG"
          --commit="$PIGE_RELEASE_COMMIT"
          --build-report=artifacts/release-packageability/macos-arm64/packageability-report.json
          --report=artifacts/release-evidence/v0.1/macos-downloaded/${{ needs.validate.outputs.commit }}/qualification.json

      - name: Stage and checksum downloaded qualification evidence
        run: |
          cp "artifacts/release-evidence/v0.1/macos-downloaded/$PIGE_RELEASE_COMMIT/qualification.json" \
            artifacts/release-packageability/macos-arm64/macos-downloaded-qualification.json
          cp "artifacts/release-evidence/v0.1/macos-downloaded/$PIGE_RELEASE_COMMIT/packaged-ui.png" \
            artifacts/release-packageability/macos-arm64/downloaded-packaged-ui.png
          cd artifacts/release-packageability/macos-arm64
          shasum -a 256 \
            packageability-report.json packaged-ui.png \
            macos-downloaded-qualification.json downloaded-packaged-ui.png \
            public-alpha-scenario-report.json local-database-scale-report.json \
            pige.cdx.json third-party-attribution.json NOTICE LICENSE \
            > RELEASE-EVIDENCE-SHA256SUMS.txt

      - name: Upload verified macOS release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pige-verified-macos-arm64-${{ needs.validate.outputs.commit }}
          path: |
            artifacts/release-packageability/macos-arm64/Pige-${{ needs.validate.outputs.version }}-arm64.zip
            artifacts/release-packageability/macos-arm64/release-manifest-macos-arm64.json
            artifacts/release-packageability/macos-arm64/SHA256SUMS-macos-arm64.txt
            artifacts/release-packageability/macos-arm64/packageability-report.json
            artifacts/release-packageability/macos-arm64/packaged-ui.png
            artifacts/release-packageability/macos-arm64/macos-downloaded-qualification.json
            artifacts/release-packageability/macos-arm64/downloaded-packaged-ui.png
            artifacts/release-packageability/macos-arm64/public-alpha-scenario-report.json
            artifacts/release-packageability/macos-arm64/local-database-scale-report.json
            artifacts/release-packageability/macos-arm64/RELEASE-EVIDENCE-SHA256SUMS.txt
            artifacts/release-packageability/macos-arm64/pige.cdx.json
            artifacts/release-packageability/macos-arm64/third-party-attribution.json
            artifacts/release-packageability/macos-arm64/NOTICE
            artifacts/release-packageability/macos-arm64/LICENSE
          if-no-files-found: error
          retention-days: 2

      - name: Upload downloaded qualification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pige-qualified-macos-arm64-${{ needs.validate.outputs.commit }}
          path: artifacts/release-evidence/v0.1/macos-downloaded/${{ needs.validate.outputs.commit }}
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish qualified GitHub prerelease
    needs: [validate, verify-macos-arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      PIGE_RELEASE_TAG: ${{ needs.validate.outputs.tag }}
      PIGE_RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
      PIGE_RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Checkout publisher at validated commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ needs.validate.outputs.commit }}

      - name: Download independently qualified macOS assets
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: pige-verified-macos-arm64-${{ needs.validate.outputs.commit }}
          path: artifacts/release-packageability/macos-arm64

      - name: Reverify exact publication bytes
        run: >-
          node scripts/release/release-artifacts.mjs
          --action=verify
          --directory=artifacts/release-packageability/macos-arm64
          --platform=macos-arm64
          --tag="$PIGE_RELEASE_TAG"
          --commit="$PIGE_RELEASE_COMMIT"

      - name: Reverify exact release acceptance evidence
        run: >-
          node scripts/release/release-evidence-bundle.mjs
          --action=verify
          --directory=artifacts/release-packageability/macos-arm64
          --tag="$PIGE_RELEASE_TAG"
          --commit="$PIGE_RELEASE_COMMIT"
          --build-id="$PIGE_RELEASE_COMMIT"

      - name: Publish immutable ad-hoc prerelease
        run: |
          cat > "$RUNNER_TEMP/pige-release-notes.md" <<'EOF'
          This macOS arm64 alpha is ad-hoc signed. macOS will identify it as coming from an unknown developer; it must never report the app as damaged or invalid.

          After attempting to open Pige, use System Settings > Privacy & Security > Open Anyway if you choose to trust this download. Verify the published SHA-256 manifest before opening it.

          Automatic updates are unavailable in this alpha. Install future versions by downloading them manually from this GitHub Releases page.
          EOF
          gh release create "$PIGE_RELEASE_TAG" \
            "artifacts/release-packageability/macos-arm64/Pige-$PIGE_RELEASE_VERSION-arm64.zip" \
            artifacts/release-packageability/macos-arm64/release-manifest-macos-arm64.json \
            artifacts/release-packageability/macos-arm64/SHA256SUMS-macos-arm64.txt \
            artifacts/release-packageability/macos-arm64/packageability-report.json \
            artifacts/release-packageability/macos-arm64/packaged-ui.png \
            artifacts/release-packageability/macos-arm64/macos-downloaded-qualification.json \
            artifacts/release-packageability/macos-arm64/downloaded-packaged-ui.png \
            artifacts/release-packageability/macos-arm64/public-alpha-scenario-report.json \
            artifacts/release-packageability/macos-arm64/local-database-scale-report.json \
            artifacts/release-packageability/macos-arm64/RELEASE-EVIDENCE-SHA256SUMS.txt \
            artifacts/release-packageability/macos-arm64/pige.cdx.json \
            artifacts/release-packageability/macos-arm64/third-party-attribution.json \
            artifacts/release-packageability/macos-arm64/NOTICE \
            artifacts/release-packageability/macos-arm64/LICENSE \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --prerelease \
            --notes-file "$RUNNER_TEMP/pige-release-notes.md" \
            --title "Pige $PIGE_RELEASE_VERSION (macOS arm64 Alpha)"
